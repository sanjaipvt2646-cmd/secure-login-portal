<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Login Portal</title><link rel="stylesheet" href="/styles.css"></head><body><main class="card"><div class="mark">SL</div><p class="eyebrow">SECURE ACCOUNT ACCESS</p><h1>Welcome back<span>.</span></h1><p class="sub">Sign in or create an account to continue.</p><nav><button id="loginTab" class="active">Sign in</button><button id="registerTab">Create account</button></nav><form id="loginForm"><label>Email address</label><input name="email" type="email" placeholder="you@example.com" required><label>Password</label><input name="password" type="password" minlength="8" placeholder="Your password" required><button class="submit">Sign in →</button></form><form id="registerForm" class="hide"><label>Full name</label><input name="name" minlength="2" maxlength="80" placeholder="Your name" required><label>Email address</label><input name="email" type="email" placeholder="you@example.com" required><label>Password</label><input name="password" type="password" minlength="8" placeholder="At least 8 characters" required><button class="submit">Create account →</button></form><p id="message"></p><section id="account" class="hide"><b>Signed in successfully</b><p id="accountText"></p><button id="logout" type="button">Log out</button></section><small>Passwords are securely hashed and never shown in the user list.</small></main><script src="/app.js"></script></body></html>
